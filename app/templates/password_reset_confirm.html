{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Set New Password | FlowTenant</title>
</head>

<body>

<div class="forgot-box">

    <h2>Set New Password</h2>

    {% if validlink %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change Password
            </button>
        </form>

    {% else %}

        <p>
            This password reset link is invalid or has expired.
        </p>

        <a href="{% url 'forgot_password' %}">
            Request a new reset link
        </a>

    {% endif %}

</div>

</body>
</html>
