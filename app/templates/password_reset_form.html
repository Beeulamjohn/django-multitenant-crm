{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Forgot Password | FlowTenant</title>

<link rel="stylesheet"
      href="{% static 'css/new_password.css' %}">


</head>

<body>

<div class="login-container">

```
<div class="login-card">

    <div class="logo">
        FlowTenant
    </div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your email address and we will
        send you a password reset link.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="id_email">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="id_email"
                placeholder="Enter your email"
                required
                autofocus
            >

        </div>

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div class="forgot-password"
         style="margin-top: 20px; text-align: center;">

        <a href="{% url 'login' %}">
            Back to Login
        </a>

    </div>

</div>


</div>

</body>
</html>
