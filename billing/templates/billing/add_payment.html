{% load static %}
<!DOCTYPE html>
<html>

<head>

<title>Add Payment</title>

<link rel="stylesheet"
      href="{% static 'css/add_payment.css' %}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>

<i class="fas fa-credit-card"></i>

Add Payment

</h1>

<a href="{% url 'payment_list' %}"
class="back-btn">

Back

</a>

</div>


<div class="card">

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="input-box">

<label>

Student

</label>

<select name="student" required>

<option value="">

Select Student

</option>

{% for student in students %}

<option value="{{ student.id }}">

{{ student.first_name }}

{{ student.last_name }}

</option>

{% endfor %}

</select>

</div>


<div class="input-box">

<label>

Amount

</label>

<input type="number"

name="amount"
autocomplete="off"
required>

</div>


<div class="input-box">

<label>

Payment Method

</label>

<select name="payment_method">

<option>Cash</option>

<option>UPI</option>

<option>Card</option>

<option>Bank Transfer</option>

</select>

</div>


<div class="input-box">

<label>

Payment Date

</label>

<input type="date"

name="payment_date"
autocomplete="off"

required>

</div>

</div>


<button type="submit"
class="save-btn">

<i class="fas fa-save"></i>

Save Payment

</button>

</form>

</div>

</div>

</body>

</html>
