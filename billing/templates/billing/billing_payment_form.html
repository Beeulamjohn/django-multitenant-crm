{% load static %}

<!DOCTYPE html>

<html lang="en"
      class="{% if appearance.theme == 'dark' %}dark-theme{% else %}light-theme{% endif %}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Add Payment</title>

    <link rel="stylesheet" href="{% static 'css/billing_payment_form.css' %}">
          
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        :root {

            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};

        }

    </style>

</head>

<body>

<div class="container">


    <div class="header">

        <div>

            <h1>

                <i class="fas fa-credit-card"></i>

                Add Payment

            </h1>

            <p>Create a new student payment.</p>

        </div>

        <a href="{% url 'billing_dashboard' %}" class="back-btn">

            Back

        </a>

    </div>


    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label>Receipt Number</label>

                    {{ form.receipt_number }}

                </div>

                <div class="form-group">

                    <label>Student</label>

                    {{ form.student }}

                </div>
                

                <div class="form-group">

    <label>Course</label>

    <input
        type="text"
        id="course"
        class="form-control"
        readonly>

</div>

                <div class="form-group">

                    <label>Amount</label>

                    {{ form.amount }}

                </div>

                <div class="form-group">

                    <label>Payment Method</label>

                    {{ form.payment_method }}

                </div>

                <div class="form-group">

                    <label>Payment Date</label>

                    {{ form.payment_date }}

                </div>

                <div class="form-group">

                    <label>Status</label>

                    {{ form.status }}

                </div>

                <div class="form-group full-width">

                    <label>Remarks</label>

                    {{ form.remarks }}

                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="save-btn">

                    <i class="fas fa-save"></i>

                    Save Payment

                </button>

                <a href="{% url 'billing_payment_list' %}" class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
