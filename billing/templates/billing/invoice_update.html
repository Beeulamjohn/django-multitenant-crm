{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Invoice</title>

    <link rel="stylesheet" href="{% static 'css/invoice_form.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1><i class="fas fa-edit"></i> Edit Invoice</h1>

        <a href="{% url 'create_invoice_list' %}" class="back-btn">
 Back
        </a>
    </div>

    <form method="POST" action="{% url 'create_invoice_update' invoice.id %}">
        {% csrf_token %}

        <div class="card">

            <div class="input-box">
                <label>Invoice Number</label>
                <input type="text" name="invoice_number"
                       value="{{ invoice.invoice_number }}" required>
            </div>

            <div class="input-box">
                <label>Total Amount</label>
                <input type="number" step="0.01" name="total_amount"
                       value="{{ invoice.total_amount }}" required>
            </div>

            <div class="input-box">
                <label>Amount Paid</label>
                <input type="number" step="0.01" name="amount_paid"
                       value="{{ invoice.amount_paid }}" required>
            </div>

            <div class="input-box">
                <label>Due Date</label>
                <input type="date" name="due_date"
                       value="{{ invoice.due_date|date:'Y-m-d' }}">
            </div>

            <div class="input-box">
                <label>Status</label>

                <select name="status">
                    <option value="Pending" {% if invoice.status == "Pending" %}selected{% endif %}>Pending</option>
                    <option value="Partial" {% if invoice.status == "Partial" %}selected{% endif %}>Partial</option>
                    <option value="Paid" {% if invoice.status == "Paid" %}selected{% endif %}>Paid</option>
                    <option value="Overdue" {% if invoice.status == "Overdue" %}selected{% endif %}>Overdue</option>
                </select>
            </div>

            <button type="submit" class="save-btn">
                <i class="fas fa-save"></i> Update Invoice
            </button>

        </div>
    </form>

</div>
</body>
</html>
