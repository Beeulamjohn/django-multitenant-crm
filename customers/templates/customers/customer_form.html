{% load static %}

<!DOCTYPE html>
<html
    lang="en"
    data-theme="{{ theme|default:'light' }}"
    data-font-size="medium"
    data-dashboard-layout="grid"
    data-sidebar-style="expanded"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Customer | FlowTenant CRM</title>

    <style>
    :root {
        --accent-color: {{ accent_color|default:'#2563eb' }};
        --primary: var(--accent-color);
    }
</style>

    <link rel="stylesheet" href="{% static 'css/customer_form.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="form-container">

    <div class="page-header">

        <div>
            <h1>Add New Customer</h1>
            <p>Create a new customer account for your CRM.</p>
        </div>

        <a href="{% url 'product_dashboard' %}" class="btn-back">
            
            Back 
        </a>

    </div>

    <form method="POST" class="customer-form">

        {% csrf_token %}
        <div class="card">

            <h2>
                <i class="fas fa-user"></i>
                Customer Information
            </h2>

            <div class="grid">

                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" name="name" required>
                </div>

                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" name="company_name">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email">
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" name="phone">
                </div>

            </div>

        </div>
        <div class="card">

            <h2>
                <i class="fas fa-location-dot"></i>
                Address
            </h2>

            <div class="grid">

                <div class="form-group full">
                    <label>Address</label>
                    <textarea name="address" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="state">
                </div>

                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country">
                </div>

                <div class="form-group">
                    <label>Postal Code</label>
                    <input type="text" name="postal_code">
                </div>

            </div>

        </div>
        <div class="card">

            <h2>
                <i class="fas fa-building"></i>
                Business Information
            </h2>

            <div class="grid">

                <div class="form-group">
                    <label>GST Number</label>
                    <input type="text" name="gst_number">
                </div>

                <div class="form-group">
                    <label>Customer Type</label>

                    <select name="customer_type">

                        <option value="">Select</option>
                        <option>Individual</option>
                        <option>Business</option>
                        <option>Corporate</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select name="status">

                        <option>Active</option>
                        <option>Inactive</option>

                    </select>

                </div>

            </div>

        </div>

        <div class="buttons">

            <button type="reset" class="btn-reset">
                Reset
            </button>

            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i>
                Save Customer
            </button>

        </div>

    </form>

</div>

</body>
</html>
