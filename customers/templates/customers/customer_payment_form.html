{% load static %}

<!DOCTYPE html>
<html lang="en"
      data-theme="{{ theme|default:'light' }}"
      style="--accent-color: {{ accent_color|default:'#2563eb' }};">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Receive Payment | FlowTenant CRM</title>

    <link rel="stylesheet"
          href="{% static 'css/former.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<div class="page">

    <div class="page-header">

        <div>

            <h1>Receive Payment</h1>

            <p>Record a customer payment securely.</p>

        </div>

        <a href="{% url 'product_dashboard' %}" class="btn-back">


            Back 

        </a>

    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="card">

            <h2>
                <i class="fas fa-credit-card"></i>
                Payment Details
            </h2>

            <div class="grid">

                <div class="form-group">

                    <label>Payment Number</label>

                    <input
                        type="text"
                        name="payment_number"
                        placeholder="PAY-0001"
                        required>

                </div>

                <div class="form-group">

                    <label>Customer</label>

                    <select name="customer" required>

                        <option value="">Select Customer</option>

                        {% for customer in customers %}
                        <option value="{{ customer.id }}">
                            {{ customer.name }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>Payment Date</label>

                    <input
                        type="date"
                        name="payment_date"
                        required>

                </div>

                <div class="form-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        placeholder="0.00"
                        required>

                </div>

                <div class="form-group">

                    <label>Payment Method</label>

                    <select name="payment_method">

                        <option>Cash</option>
                        <option>UPI</option>
                        <option>Card</option>
                        <option>Bank Transfer</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select name="status">

                        <option>Paid</option>
                        <option>Pending</option>
                        <option>Failed</option>

                    </select>

                </div>

                <div class="form-group full">

                    <label>Notes</label>

                    <textarea
                        name="notes"
                        rows="5"
                        placeholder="Payment remarks..."></textarea>

                </div>

            </div>

        </div>

        <div class="button-group">

    <a href="{% url 'customer_payment_list' %}" class="btn-cancel">
        Cancel
    </a>

    <button type="button"
            class="btn-print"
            onclick="window.print()">
        <i class="fas fa-print"></i>
        Print
    </button>

    <button type="submit"
            class="btn-save">
        <i class="fas fa-save"></i>
        Save Payment
    </button>

</div>

    </form>

</div>

</body>
</html>
