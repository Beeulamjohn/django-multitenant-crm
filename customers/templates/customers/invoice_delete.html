{% load static %}

<!DOCTYPE html>

<html
    lang="en"
    data-theme="dark"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Delete Invoice
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/invoice.css' %}"
    >

</head>


<body>


<div class="delete-page">


    <div class="delete-card">

        <div class="delete-icon">

            <i class="fas fa-trash"></i>

        </div>


        <h1>
            Delete Invoice?
        </h1>


        <p>
            Are you sure you want to delete
            invoice
            <strong>
                {{ invoice.invoice_number }}
            </strong>?
        </p>


        <form
            method="POST"
        >

            {% csrf_token %}


            <div class="delete-actions">

                <a
                    href="{% url 'invoice_list' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="delete-confirm-btn"
                >
                    Yes, Delete
                </button>

            </div>

        </form>


    </div>


</div>


</body>

</html>
