{% load static %}

<!DOCTYPE html>

<html
    lang="en"
    data-theme="{{ theme|default:'light' }}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Invoice | FlowTenant CRM</title>

    <style>

        :root {

            --accent-color:
                {{ accent_color|default:'#2563eb' }};

            --primary:
                var(--accent-color);

        }

    </style>

    <link
        rel="stylesheet"
        href="{% static 'css/invoice_edit.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


<div class="invoice-container">


    <div class="page-header">

        <div>

            <h1>Edit Invoice</h1>

            <p>
                Update invoice information and payment details.
            </p>

        </div>


        <a
            href="{% url 'invoice_list' %}"
            class="btn-back"
        >

            <i class="fas fa-arrow-left"></i>

            Back

        </a>

    </div>



    <form method="POST">

        {% csrf_token %}



        <!-- Invoice Information -->

        <div class="card">

            <h2>

                <i class="fas fa-file-invoice"></i>

                Invoice Information

            </h2>


            <div class="grid">


                <div class="form-group">

                    <label>
                        Invoice Number
                    </label>

                    <input
                        type="text"
                        name="invoice_number"
                        value="{{ invoice.invoice_number }}"
                        placeholder="INV-0001"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Customer
                    </label>

                    <select
                        name="customer"
                        required
                    >

                        <option value="">
                            Select Customer
                        </option>


                        {% for customer in customers %}

                        <option
                            value="{{ customer.id }}"
                            {% if customer.id == invoice.customer.id %}
                                selected
                            {% endif %}
                        >

                            {{ customer.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>



                <div class="form-group">

                    <label>
                        Invoice Date
                    </label>

                    <input
                        type="date"
                        name="invoice_date"
                        value="{{ invoice.invoice_date|date:'Y-m-d' }}"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Due Date
                    </label>

                    <input
                        type="date"
                        name="due_date"
                        value="{{ invoice.due_date|date:'Y-m-d' }}"
                    >

                </div>


            </div>

        </div>



        <!-- Product Details -->

        <div class="card">

            <h2>

                <i class="fas fa-box-open"></i>

                Product Details

            </h2>


            <div class="grid">


                <div class="form-group">

                    <label>
                        Product
                    </label>

                    <input
                        type="text"
                        name="product"
                        value="{{ invoice.product|default:'' }}"
                        placeholder="Product name"
                    >

                </div>



                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        value="{{ invoice.quantity|default:'1' }}"
                        min="1"
                    >

                </div>



                <div class="form-group">

                    <label>
                        Unit Price
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="unit_price"
                        value="{{ invoice.unit_price|default:'' }}"
                        min="0"
                    >

                </div>



                <div class="form-group">

                    <label>
                        GST (%)
                    </label>

                    <input
                        type="number"
                        name="gst"
                        value="{{ invoice.gst|default:'18' }}"
                        min="0"
                        step="0.01"
                    >

                </div>


            </div>

        </div>



        <!-- Payment -->

        <div class="card">

            <h2>

                <i class="fas fa-wallet"></i>

                Payment

            </h2>


            <div class="grid">


                <div class="form-group">

                    <label>
                        Total Amount
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="total_amount"
                        value="{{ invoice.total_amount }}"
                        min="0"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Payment Status
                    </label>

                    <select
                        name="payment_status"
                        required
                    >

                        <option
                            value="Pending"
                            {% if invoice.payment_status == "Pending" %}
                                selected
                            {% endif %}
                        >
                            Pending
                        </option>


                        <option
                            value="Paid"
                            {% if invoice.payment_status == "Paid" %}
                                selected
                            {% endif %}
                        >
                            Paid
                        </option>


                        <option
                            value="Partial"
                            {% if invoice.payment_status == "Partial" %}
                                selected
                            {% endif %}
                        >
                            Partial
                        </option>


                        <option
                            value="Overdue"
                            {% if invoice.payment_status == "Overdue" %}
                                selected
                            {% endif %}
                        >
                            Overdue
                        </option>

                    </select>

                </div>


            </div>

        </div>



        <!-- Notes -->

        <div class="card">

            <h2>

                <i class="fas fa-note-sticky"></i>

                Notes

            </h2>


            <textarea
                name="notes"
                rows="5"
                placeholder="Additional invoice notes..."
            >{{ invoice.notes|default:'' }}</textarea>

        </div>



        <!-- Buttons -->

        <div class="button-group">


            <a
                href="{% url 'invoice_list' %}"
                class="btn-cancel"
            >

                <i class="fas fa-times"></i>

                Cancel

            </a>


            <button
                type="submit"
                class="btn-save"
            >

                <i class="fas fa-save"></i>

                Update Invoice

            </button>


        </div>


    </form>


</div>


</body>

</html>
