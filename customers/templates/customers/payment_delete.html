{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Payment | FlowTenant CRM</title>

    <link
        rel="stylesheet"
        href="{% static 'css/customer_payment.css' %}"
    >

</head>

<body>

<div class="page">

    <div class="delete-card">

        <div class="delete-icon">

            <i class="fas fa-trash"></i>

        </div>

        <h1>
            Delete Payment?
        </h1>

        <p>
            Are you sure you want to delete this payment?
        </p>

        <div class="delete-info">

            <strong>
                {{ payment.receipt_number }}
            </strong>

            <span>
                {{ payment.customer.name }}
            </span>

            <span>
                ₹{{ payment.amount }}
            </span>

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="button-group">

                <a
                    href="{% url 'customer_payment_list' %}"
                    class="btn-cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn-danger"
                >
                    <i class="fas fa-trash"></i>
                    Delete Payment
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
