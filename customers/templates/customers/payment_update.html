{% load static %}

<!DOCTYPE html>
<html
    lang="en"
    data-theme="{{ theme|default:'light' }}"
    style="--accent-color: {{ accent_color|default:'#2563eb' }};"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Payment | FlowTenant CRM</title>

    <link
        rel="stylesheet"
        href="{% static 'css/payment_update.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>

<body>

<div class="page">

    <div class="page-header">

        <div>

            <h1>Edit Payment</h1>

            <p>
                Update customer payment information.
            </p>

        </div>

        <a
            href="{% url 'customer_payment_list' %}"
            class="btn-back"
        >
            <i class="fas fa-arrow-left"></i>
            Back
        </a>

    </div>


    <form method="POST">

        {% csrf_token %}


        <div class="card">

            <h2>
                <i class="fas fa-credit-card"></i>
                Payment Details
            </h2>


            <div class="grid">

                <div class="form-group">

                    <label>
                        Receipt Number
                    </label>

                    <input
                        type="text"
                        name="receipt_number"
                        value="{{ payment.receipt_number }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Customer
                    </label>

                    <select
                        name="customer"
                        required
                    >

                        {% for customer in customers %}

                        <option
                            value="{{ customer.id }}"
                            {% if customer.id == payment.customer.id %}
                                selected
                            {% endif %}
                        >
                            {{ customer.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Payment Date
                    </label>

                    <input
                        type="date"
                        name="payment_date"
                        value="{{ payment.payment_date|date:'Y-m-d' }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Amount
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        name="amount"
                        value="{{ payment.amount }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select
                        name="payment_method"
                        required
                    >

                        <option
                            value="Cash"
                            {% if payment.payment_method == "Cash" %}
                                selected
                            {% endif %}
                        >
                            Cash
                        </option>

                        <option
                            value="UPI"
                            {% if payment.payment_method == "UPI" %}
                                selected
                            {% endif %}
                        >
                            UPI
                        </option>

                        <option
                            value="Card"
                            {% if payment.payment_method == "Card" %}
                                selected
                            {% endif %}
                        >
                            Card
                        </option>

                        <option
                            value="Bank Transfer"
                            {% if payment.payment_method == "Bank Transfer" %}
                                selected
                            {% endif %}
                        >
                            Bank Transfer
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select
                        name="status"
                        required
                    >

                        <option
                            value="Paid"
                            {% if payment.status == "Paid" %}
                                selected
                            {% endif %}
                        >
                            Paid
                        </option>

                        <option
                            value="Partial"
                            {% if payment.status == "Partial" %}
                                selected
                            {% endif %}
                        >
                            Partial
                        </option>

                        <option
                            value="Pending"
                            {% if payment.status == "Pending" %}
                                selected
                            {% endif %}
                        >
                            Pending
                        </option>

                        <option
                            value="Failed"
                            {% if payment.status == "Failed" %}
                                selected
                            {% endif %}
                        >
                            Failed
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        rows="5"
                        placeholder="Payment remarks..."
                    >{{ payment.notes|default:"" }}</textarea>

                </div>

            </div>

        </div>


        <div class="button-group">

            <a
                href="{% url 'customer_payment_list' %}"
                class="btn-cancel"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn-save"
            >
                <i class="fas fa-save"></i>
                Update Payment
            </button>

        </div>

    </form>

</div>

</body>
</html>
