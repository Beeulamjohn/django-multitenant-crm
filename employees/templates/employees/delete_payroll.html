{% load static %}
<!DOCTYPE html>
<html lang="{{ appearance.language|default:'en' }}"
      data-theme="{{ appearance.theme|default:'light' }}"
      data-font-size="{{ appearance.font_size|default:'medium' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Payroll | FlowTenant CRM</title>

    <style>
        :root{
            --accent-color: {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>

    <link rel="stylesheet" href="{% static 'css/delete_payroll.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="delete-card">

    <div class="icon">
        <i class="fas fa-trash-alt"></i>
    </div>

    <h2>Delete Payroll</h2>

    <p>
        Are you sure you want to delete the payroll record of
        <strong>{{ payroll.employee.first_name }} {{ payroll.employee.last_name }}</strong>?
    </p>

    <div class="payroll-info">
        <div><span>Month</span><strong>{{ payroll.month }} {{ payroll.year }}</strong></div>
        <div><span>Net Salary</span><strong>₹{{ payroll.net_salary }}</strong></div>
    </div>

    <form method="POST" class="actions">
        {% csrf_token %}

        <button type="submit" class="delete-btn">
            <i class="fas fa-trash"></i>
            Delete
        </button>

        <a href="{% url 'employee_payroll' %}" class="cancel-btn">
            <i class="fas fa-arrow-left"></i>
            Cancel
        </a>
    </form>

</div>

</body>
</html>
