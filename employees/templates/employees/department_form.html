{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

     <title>Add Department | FlowTenant CRM</title>
    <style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>  
<link rel="stylesheet"
href="{% static 'css/department_form.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="form-card">

        <div class="header">

            <h1>

                <i class="fas fa-sitemap"></i>

                Add Department

            </h1>

            <p>

                Create a new department for your organization.

            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>

                    <i class="fas fa-building"></i>

                    Department Name

                </label>

                <input type="text"
                       name="name"
                       placeholder="Example: Human Resources"
                       required>

            </div>

            <div class="form-group">

                <label>

                    <i class="fas fa-align-left"></i>

                    Description

                </label>

                <textarea name="description"
                          rows="6"
                          placeholder="Enter department description..."></textarea>

            </div>

            <div class="buttons">

                <button type="submit" class="save-btn">

                    <i class="fas fa-save"></i>

                    Save Department

                </button>

                <a href="{% url 'employee_dashboard' %}" class="cancel-btn">


                    Back

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
