{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

     <title>Mark Attendance | FlowTenant CRM</title>
    <style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>  
<link rel="stylesheet"
href="{% static 'css/employee_attendance_form.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="attendance-card">

        <!-- Header -->

        <div class="header">

            <div>

                <h1>

                    <i class="fas fa-user-clock"></i>

                    Mark Attendance

                </h1>

                <p>

                    Record employee attendance quickly and accurately.

                </p>

            </div>

            <a href="{% url 'employee_dashboard' %}" class="back-btn">

                Back 
            </a>

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        <i class="fas fa-user"></i>

                        Employee

                    </label>

                    <select name="employee" required>

                        <option value="">Select Employee</option>

                        {% for employee in employees %}

                        <option value="{{ employee.id }}">

                            {{ employee.employee_id }} -
                            {{ employee.first_name }}
                            {{ employee.last_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        <i class="fas fa-calendar-alt"></i>

                        Attendance Date

                    </label>

                    <input type="date"
                           name="date"
                           required>

                </div>

                <div class="form-group full-width">

                    <label>

                        <i class="fas fa-check-circle"></i>

                        Attendance Status

                    </label>

                    <select name="status" required>

                        <option value="Present">Present</option>

                        <option value="Absent">Absent</option>

                        <option value="Late">Late</option>

                        <option value="Leave">Leave</option>

                    </select>

                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="save-btn">

                    <i class="fas fa-save"></i>

                    Save Attendance

                </button>

                <a href="{% url 'employee_dashboard' %}" class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
