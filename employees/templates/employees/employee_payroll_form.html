{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

     <title>Add payroll | FlowTenant CRM</title>
    <style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>  
<link rel="stylesheet"
href="{% static 'css/employee_payroll_form.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="payroll-card">

        <div class="header">

            <div>

                <h1>

                    <i class="fas fa-money-check-dollar"></i>

                    Add Payroll

                </h1>

                <p>

                    Create a payroll record for an employee.

                </p>

            </div>

            <a href="{% url 'employee_dashboard' %}" class="back-btn">

                Back
            </a>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        <i class="fas fa-user"></i>

                        Employee

                    </label>

                    <select name="employee" required>

                        <option value="">Select Employee</option>

                        {% for employee in employees %}

                        <option value="{{ employee.id }}">

                            {{ employee.employee_id }} -
                            {{ employee.first_name }}
                            {{ employee.last_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>
                <div class="form-group">

                    <label>

                        <i class="fas fa-calendar"></i>

                        Month

                    </label>

                    <select name="month" required>

                        <option value="">Select Month</option>

                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>

                    </select>

                </div>
                <div class="form-group">

                    <label>

                        <i class="fas fa-calendar-alt"></i>

                        Year

                    </label>

                    <input type="number"
                           name="year"
                           placeholder="2026"
                           required>

                </div>


                <div class="form-group">

                    <label>

                        <i class="fas fa-wallet"></i>

                        Basic Salary

                    </label>

                    <input type="number"
                           name="basic_salary"
                           placeholder="25000"
                           required>

                </div>

                <div class="form-group">

                    <label>

                        <i class="fas fa-gift"></i>

                        Bonus

                    </label>

                    <input type="number"
                           name="bonus"
                           value="0">

                </div>

                <div class="form-group">

                    <label>

                        <i class="fas fa-minus-circle"></i>

                        Deduction

                    </label>

                    <input type="number"
                           name="deduction"
                           value="0">

                </div>

                <div class="form-group full">

                    <label>

                        <i class="fas fa-check-circle"></i>

                        Payment Status

                    </label>

                    <select name="payment_status">

                        <option value="Pending">

                            Pending

                        </option>

                        <option value="Paid">

                            Paid

                        </option>

                    </select>

                </div>

            </div>

            <div class="buttons">

                <button type="submit" class="save-btn">

                    <i class="fas fa-save"></i>

                    Save Payroll

                </button>

                <a href="{% url 'employee_dashboard' %}" class="cancel-btn">

                    <i class="fas fa-times"></i>

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
