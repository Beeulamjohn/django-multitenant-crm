{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Add Employee | Salary Management
</title>

<style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>

<link rel="stylesheet"
href="{% static 'css/add_employee.css' %}">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>


<div class="dashboard">



<main class="main-content">



<div class="top-header">


<div>


<h1>

<i class="fas fa-user-plus"></i>

Add Employee

</h1>


<p>
Create new employee salary profile
</p>


</div>



<a href="{% url 'employee_salary_list' %}"
class="back-btn">

Back


</a>


</div>





<!-- ==========================
        FORM CARD
=========================== -->


<div class="form-card">


<div class="form-title">


<i class="fas fa-id-card"></i>


<h2>
Employee Information
</h2>


</div>




<form method="POST">


{% csrf_token %}




<div class="form-grid">



<div class="form-group">

<label>

Employee ID

</label>

{{ form.employee_id }}

</div>




<div class="form-group">

<label>

Employee Name

</label>

{{ form.name }}

</div>




<div class="form-group">

<label>

Department

</label>

{{ form.department }}

</div>




<div class="form-group">

<label>

Designation

</label>

{{ form.designation }}

</div>




<div class="form-group">

<label>

Basic Salary

</label>

{{ form.basic_salary }}

</div>



 <div class="form-group">

                        <label>

                            Status

                        </label>


                        <select
                            name="status"
                        >

                            <option
                                value="Active"
                                {% if employee.status == "Active" %}
                                    selected
                                {% endif %}
                            >
                                Active
                            </option>


                            <option
                                value="Inactive"
                                {% if employee.status == "Inactive" %}
                                    selected
                                {% endif %}
                            >
                                Inactive
                            </option>


                            <option
                                value="Resigned"
                                {% if employee.status == "Resigned" %}
                                    selected
                                {% endif %}
                            >
                                Resigned
                            </option>


                            <option
                                value="Terminated"
                                {% if employee.status == "Terminated" %}
                                    selected
                                {% endif %}
                            >
                                Terminated
                            </option>

                        </select>

                    </div>





<div class="form-group">

<label>

Joining Date

</label>

{{ form.joined_date }}

</div>




</div>





<div class="button-area">


<button type="submit"
class="save-btn">


<i class="fas fa-save"></i>


Save Employee


</button>



<a href="{% url 'salary_dashboard' %}"
class="cancel-btn">


<i class="fas fa-times"></i>


Cancel


</a>



</div>



</form>



</div>




</main>



</div>



</body>

</html>
