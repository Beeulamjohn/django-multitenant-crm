{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Add Employee Bonus
</title>
<style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>


<link rel="stylesheet"
href="{% static 'css/bonus_create.css' %}">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="container">



<!-- HEADER -->


<div class="page-header">


<div class="title">


<div class="icon-box">

<i class="fa-solid fa-gift"></i>

</div>



<div>

<h1>
Add Employee Bonus
</h1>


<p>
Create employee reward and incentive record
</p>


</div>


</div>




<a href="{% url 'salary_dashboard' %}"
class="back-btn">


Back 

</a>


</div>








<!-- FORM -->


<div class="form-card">


<form method="POST">


{% csrf_token %}




<h2>

<i class="fa fa-user"></i>

Employee Details

</h2>




<div class="grid">



<div class="form-group">


<label>
Select Employee
</label>


<select name="employee"
required>


<option value="">
Choose Employee
</option>



{% for employee in employees %}


<option value="{{employee.id}}">

{{employee.name}}

{% if employee.department %}

- {{employee.department}}

{% endif %}

</option>


{% endfor %}


</select>


</div>





<div class="form-group">


<label>
Bonus Date
</label>


<input type="date"
name="bonus_date"
required>


</div>


</div>









<h2>

<i class="fa fa-gift"></i>

Bonus Information

</h2>




<div class="grid">





<div class="form-group">


<label>
Bonus Title
</label>


<input type="text"
name="bonus_title"
placeholder="Example: Performance Bonus"
required>


</div>







<div class="form-group">


<label>
Bonus Type
</label>


<select name="bonus_type">


<option value="Performance">
Performance
</option>


<option value="Festival">
Festival
</option>


<option value="Annual">
Annual
</option>


<option value="Other">
Other
</option>


</select>


</div>







<div class="form-group">


<label>
Bonus Amount
</label>


<div class="money">


<span>
₹
</span>


<input type="number"
name="amount"
placeholder="0.00"
required>


</div>


</div>







<div class="form-group">


<label>
Payment Status
</label>


<select name="payment_status">


<option value="Pending">
Pending
</option>


<option value="Paid">
Paid
</option>


</select>


</div>



</div>









<div class="form-group full">


<label>
Description
</label>


<textarea
name="description"
rows="4"
placeholder="Enter bonus details..."></textarea>


</div>







<button class="save-btn"
type="submit">


<i class="fa fa-save"></i>

Save Bonus


</button>





</form>



</div>




</div>


</body>

</html>
