{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Add Deduction
</title>
<style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>


<link rel="stylesheet"
href="{% static 'css/deduction_create.css' %}">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="container">



<!-- HEADER -->


<div class="page-header">


<div class="title">


<div class="icon-box">

<i class="fa-solid fa-percent"></i>

</div>


<div>

<h1>
Add Employee Deduction
</h1>


<p>
Create salary deduction record for employees
</p>


</div>


</div>





<a href="{% url 'salary_dashboard' %}"
class="back-btn">


Back 


</a>



</div>









<!-- FORM -->


<div class="form-card">


<form method="POST">


{% csrf_token %}



<h2>

<i class="fa fa-user-tie"></i>

Employee Information

</h2>



<div class="grid">



<div class="form-group">


<label>
Select Employee
</label>


<select name="employee"
required>


<option value="">
Choose Employee
</option>



{% for employee in employees %}


<option value="{{employee.id}}">

{{employee.name}}

{% if employee.department %}

- {{employee.department}}

{% endif %}

</option>


{% endfor %}


</select>


</div>






<div class="form-group">


<label>
Deduction Date
</label>


<input type="date"
name="deduction_date"
required>


</div>



</div>









<h2>

<i class="fa fa-file-invoice"></i>

Deduction Details

</h2>





<div class="grid">





<div class="form-group">


<label>
Deduction Title
</label>


<input type="text"
name="deduction_title"
placeholder="Example: PF Deduction"
required>


</div>







<div class="form-group">


<label>
Deduction Type
</label>


<select name="deduction_type">


<option value="PF">
PF
</option>


<option value="ESI">
ESI
</option>


<option value="Tax">
Tax
</option>


<option value="Loan">
Loan
</option>


<option value="Other">
Other
</option>


</select>


</div>







<div class="form-group">


<label>
Deduction Amount
</label>


<div class="amount-box">


<span>
₹
</span>


<input type="number"
name="amount"
placeholder="0.00"
required>


</div>


</div>








<div class="form-group">


<label>
Status
</label>


<select name="status">


<option value="Applied">
Applied
</option>


<option value="Completed">
Completed
</option>


</select>


</div>



</div>









<div class="form-group">


<label>
Description
</label>


<textarea
name="description"
rows="4"
placeholder="Enter deduction reason..."></textarea>


</div>







<button type="submit"
class="save-btn">


<i class="fa fa-save"></i>

Save Deduction


</button>



</form>



</div>





</div>


</body>


</html>
