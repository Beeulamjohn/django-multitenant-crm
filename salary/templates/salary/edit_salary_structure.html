{% load static %}

<!DOCTYPE html>

<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit Salary Structure | Salary Management
    </title>


    <style>

        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }

    </style>


    <link
        rel="stylesheet"
        href="{% static 'css/add_salary_structure.css' %}"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


<div class="page-container">


    <!-- ================= HEADER ================= -->

    <div class="header">


        <div>

            <h1>

                <i class="fas fa-edit"></i>

                Edit Salary Structure

            </h1>


            <p>

                Update employee salary configuration

            </p>

        </div>


        <a
            href="{% url 'salary_structure_list' %}"
            class="back-btn"
        >

            <i class="fas fa-arrow-left"></i>

            Back

        </a>


    </div>



    <!-- ================= FORM CARD ================= -->

    <div class="form-card">


        <div class="form-heading">

            <i class="fas fa-money-check-alt"></i>

            <h2>

                Salary Details

            </h2>

        </div>



        <!-- ================= EMPLOYEE ================= -->

        <div class="form-group">

            <label>

                Employee

            </label>


            <input
                type="text"
                value="{{ salary.employee.name }}"
                readonly
                class="readonly-input"
            >


           

        </div>



        <!-- ================= FORM ================= -->

        <form method="POST">

            {% csrf_token %}


            <div class="form-grid">


                <!-- Basic Salary -->

                <div class="form-group">

                    <label for="basic_salary">

                        Basic Salary

                    </label>


                    <input
                        type="number"
                        id="basic_salary"
                        name="basic_salary"
                        value="{{ salary.basic_salary }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>



                <!-- HRA -->

                <div class="form-group">

                    <label for="hra">

                        HRA

                    </label>


                    <input
                        type="number"
                        id="hra"
                        name="hra"
                        value="{{ salary.hra }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>



                <!-- Allowance -->

                <div class="form-group">

                    <label for="allowance">

                        Allowance

                    </label>


                    <input
                        type="number"
                        id="allowance"
                        name="allowance"
                        value="{{ salary.allowance }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>



                <!-- Deduction -->

                <div class="form-group">

                    <label for="deduction">

                        Deduction

                    </label>


                    <input
                        type="number"
                        id="deduction"
                        name="deduction"
                        value="{{ salary.deduction }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>



                <!-- Net Salary -->

                <div class="form-group">

                    <label for="net_salary">

                        Net Salary

                    </label>


                    <input
                        type="number"
                        id="net_salary"
                        name="net_salary"
                        value="{{ salary.net_salary }}"
                        step="0.01"
                        readonly
                    >

                </div>


            </div>



            <!-- ================= BUTTONS ================= -->

            <div class="action-buttons">


                <button
                    type="submit"
                    class="save-btn"
                >

                    <i class="fas fa-save"></i>

                    Update Salary Structure

                </button>



                <a
                    href="{% url 'salary_structure_list' %}"
                    class="cancel-btn"
                >

                    <i class="fas fa-times"></i>

                    Cancel

                </a>


            </div>


        </form>


    </div>


</div>



<!-- ================= NET SALARY CALCULATION ================= -->

<script>

    const basicSalary =
        document.getElementById("basic_salary");

    const hra =
        document.getElementById("hra");

    const allowance =
        document.getElementById("allowance");

    const deduction =
        document.getElementById("deduction");

    const netSalary =
        document.getElementById("net_salary");


    function calculateNetSalary() {

        const basic =
            parseFloat(basicSalary.value) || 0;

        const hraValue =
            parseFloat(hra.value) || 0;

        const allowanceValue =
            parseFloat(allowance.value) || 0;

        const deductionValue =
            parseFloat(deduction.value) || 0;


        const net =
            basic +
            hraValue +
            allowanceValue -
            deductionValue;


        netSalary.value =
            net.toFixed(2);

    }


    basicSalary.addEventListener(
        "input",
        calculateNetSalary
    );

    hra.addEventListener(
        "input",
        calculateNetSalary
    );

    allowance.addEventListener(
        "input",
        calculateNetSalary
    );

    deduction.addEventListener(
        "input",
        calculateNetSalary
    );


</script>


</body>

</html>
