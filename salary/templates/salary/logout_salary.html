{% load static %}

<!DOCTYPE html>
<html
    lang="en"
    data-theme="{{ theme_settings.theme|default:'light' }}"
    data-font-size="{{ theme_settings.font_size|default:'medium' }}"
    data-sidebar-style="{{ theme_settings.sidebar_style|default:'expanded' }}"
    style="
        --accent-color: {{ theme_settings.accent_color|default:'#2563eb' }};
    "
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Logout | FlowTenant</title>

    <link
        rel="stylesheet"
        href="{% static 'css/logout_salary.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>

<body>

    <main class="logout-page">

        <section class="logout-box">

            <!-- Logout Icon -->
            <div class="logout-icon">
                <i class="fas fa-right-from-bracket"></i>
            </div>

            <!-- Heading -->
            <h2>
                Are you sure you want to logout?
            </h2>

            <!-- Message -->
            <p class="logout-message">
                You will be signed out of your salary management account.
            </p>

            <!-- Logout Form -->
            <form
                method="POST"
                action="{% url 'logout_salary' %}"
                class="logout-form"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn-logout"
                >
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>

                <a
                    href="{% url 'salary_dashboard' %}"
                    class="btn-cancel"
                >
                    <i class="fas fa-arrow-left"></i>
                    <span>Cancel</span>
                </a>

            </form>

        </section>

    </main>

</body>

</html>
