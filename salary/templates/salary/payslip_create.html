{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>


<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Generate Payslip
</title>
<style>
        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }
    </style>


<link rel="stylesheet"
href="{% static 'css/payslip_create.css' %}">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>



<body>


<div class="container">



<!-- HEADER -->


<div class="page-header">


<div class="title">


<div class="icon-box">

<i class="fa-solid fa-file-invoice-dollar"></i>

</div>


<div>

<h1>
Generate Payslip
</h1>


<p>
Create employee monthly salary payslip
</p>


</div>


</div>




<a href="{% url 'salary_dashboard' %}"
class="back-btn">


Back 


</a>



</div>








<!-- FORM CARD -->


<div class="form-card">


<form method="POST">


{% csrf_token %}



<h2>

<i class="fa fa-user-tie"></i>

Employee Information

</h2>




<div class="form-grid">



<div class="form-group">


<label>
Select Employee
</label>



<select name="employee"
required>


<option value="">

Choose Employee

</option>



{% for employee in employees %}


<option value="{{employee.id}}">


{{employee.name}}


{% if employee.department %}

- {{employee.department}}

{% endif %}


</option>



{% endfor %}



</select>


</div>







<div class="form-group">


<label>
Salary Month
</label>


<select name="month"
required>


<option>
January
</option>


<option>
February
</option>


<option>
March
</option>


<option>
April
</option>


<option>
May
</option>


<option>
June
</option>


<option>
July
</option>


<option>
August
</option>


<option>
September
</option>


<option>
October
</option>


<option>
November
</option>


<option>
December
</option>


</select>


</div>






<div class="form-group">


<label>
Year
</label>


<input type="number"
name="year"
value="2026"
required>


</div>



</div>










<h2>

<i class="fa fa-money-bill-wave"></i>

Salary Details

</h2>





<div class="salary-grid">





<div class="form-group">


<label>
Basic Salary
</label>


<div class="input-box">

<span>
₹
</span>


<input type="number"
name="basic_salary"
placeholder="0.00"
required>


</div>


</div>








<div class="form-group">


<label>
Allowance
</label>


<div class="input-box">

<span>
₹
</span>


<input type="number"
name="allowance"
placeholder="0.00">


</div>


</div>








<div class="form-group">


<label>
Deduction
</label>


<div class="input-box">

<span>
₹
</span>


<input type="number"
name="deduction"
placeholder="0.00">


</div>


</div>



</div>









<h2>

<i class="fa fa-check-circle"></i>

Payment Status

</h2>




<div class="status-box">


<label>

<input type="radio"
name="payment_status"
value="Paid">


Paid


</label>





<label>

<input type="radio"
name="payment_status"
value="Pending"
checked>


Pending


</label>



</div>










<button type="submit"
class="save-btn">


<i class="fa fa-save"></i>

Generate Payslip


</button>




</form>



</div>





</div>



</body>

</html>
