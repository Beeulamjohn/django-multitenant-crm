{% load static %}

<!DOCTYPE html>
<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Edit Payslip
</title>


<style>

    :root {
        --accent-color:
            {{ appearance.accent_color|default:"#2563eb" }};
    }

</style>


<link
    rel="stylesheet"
    href="{% static 'css/payslip_create.css' %}"
>


<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>


</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="page-header">


        <div class="title">


            <div class="icon-box">

                <i class="fa-solid fa-file-invoice-dollar"></i>

            </div>


            <div>

                <h1>
                    Edit Payslip
                </h1>


                <p>
                    Update employee monthly salary payslip
                </p>

            </div>


        </div>


        <a
            href="{% url 'payslip_list' %}"
            class="back-btn"
        >

            <i class="fa fa-arrow-left"></i>

            Back

        </a>


    </div>



    <!-- FORM CARD -->

    <div class="form-card">


        <form method="POST">

            {% csrf_token %}



            <!-- EMPLOYEE INFORMATION -->

            <h2>

                <i class="fa fa-user-tie"></i>

                Employee Information

            </h2>



            <div class="form-grid">


                <!-- EMPLOYEE -->

                <div class="form-group">

                    <label>
                        Employee
                    </label>


                    <input
                        type="text"
                        value="{{ payslip.employee.name }}"
                        readonly
                    >

                </div>



                <!-- MONTH -->

                <div class="form-group">

                    <label>
                        Salary Month
                    </label>


                    <select
                        name="month"
                        required
                    >

                        <option
                            value="January"
                            {% if payslip.month == "January" %}
                                selected
                            {% endif %}
                        >
                            January
                        </option>


                        <option
                            value="February"
                            {% if payslip.month == "February" %}
                                selected
                            {% endif %}
                        >
                            February
                        </option>


                        <option
                            value="March"
                            {% if payslip.month == "March" %}
                                selected
                            {% endif %}
                        >
                            March
                        </option>


                        <option
                            value="April"
                            {% if payslip.month == "April" %}
                                selected
                            {% endif %}
                        >
                            April
                        </option>


                        <option
                            value="May"
                            {% if payslip.month == "May" %}
                                selected
                            {% endif %}
                        >
                            May
                        </option>


                        <option
                            value="June"
                            {% if payslip.month == "June" %}
                                selected
                            {% endif %}
                        >
                            June
                        </option>


                        <option
                            value="July"
                            {% if payslip.month == "July" %}
                                selected
                            {% endif %}
                        >
                            July
                        </option>


                        <option
                            value="August"
                            {% if payslip.month == "August" %}
                                selected
                            {% endif %}
                        >
                            August
                        </option>


                        <option
                            value="September"
                            {% if payslip.month == "September" %}
                                selected
                            {% endif %}
                        >
                            September
                        </option>


                        <option
                            value="October"
                            {% if payslip.month == "October" %}
                                selected
                            {% endif %}
                        >
                            October
                        </option>


                        <option
                            value="November"
                            {% if payslip.month == "November" %}
                                selected
                            {% endif %}
                        >
                            November
                        </option>


                        <option
                            value="December"
                            {% if payslip.month == "December" %}
                                selected
                            {% endif %}
                        >
                            December
                        </option>

                    </select>

                </div>



                <!-- YEAR -->

                <div class="form-group">

                    <label>
                        Year
                    </label>


                    <input
                        type="number"
                        name="year"
                        value="{{ payslip.year }}"
                        required
                    >

                </div>


            </div>



            <!-- SALARY DETAILS -->

            <h2>

                <i class="fa fa-money-bill-wave"></i>

                Salary Details

            </h2>



            <div class="salary-grid">


                <!-- BASIC SALARY -->

                <div class="form-group">

                    <label>
                        Basic Salary
                    </label>


                    <div class="input-box">

                        <span>
                            ₹
                        </span>


                        <input
                            type="number"
                            name="basic_salary"
                            step="0.01"
                            min="0"
                            value="{{ payslip.basic_salary }}"
                            required
                        >

                    </div>

                </div>



                <!-- ALLOWANCE -->

                <div class="form-group">

                    <label>
                        Allowance
                    </label>


                    <div class="input-box">

                        <span>
                            ₹
                        </span>


                        <input
                            type="number"
                            name="allowance"
                            step="0.01"
                            min="0"
                            value="{{ payslip.allowance|default:'0' }}"
                        >

                    </div>

                </div>



                <!-- DEDUCTION -->

                <div class="form-group">

                    <label>
                        Deduction
                    </label>


                    <div class="input-box">

                        <span>
                            ₹
                        </span>


                        <input
                            type="number"
                            name="deduction"
                            step="0.01"
                            min="0"
                            value="{{ payslip.deduction|default:'0' }}"
                        >

                    </div>

                </div>


            </div>



            <!-- PAYMENT STATUS -->

            <h2>

                <i class="fa fa-check-circle"></i>

                Payment Status

            </h2>



            <div class="status-box">


                <label>

                    <input
                        type="radio"
                        name="payment_status"
                        value="Paid"
                        {% if payslip.payment_status == "Paid" %}
                            checked
                        {% endif %}
                    >

                    Paid

                </label>



                <label>

                    <input
                        type="radio"
                        name="payment_status"
                        value="Pending"
                        {% if payslip.payment_status == "Pending" %}
                            checked
                        {% endif %}
                    >

                    Pending

                </label>


            </div>



            <!-- UPDATE BUTTON -->

            <button
                type="submit"
                class="save-btn"
            >

                <i class="fa fa-save"></i>

                Update Payslip

            </button>


        </form>


    </div>


</div>


</body>

</html>
