{% load static %}

<!DOCTYPE html>

<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit Employee | Salary Management
    </title>


    <style>

        :root {
            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};
        }

    </style>


    <link
        rel="stylesheet"
        href="{% static 'css/add_employee.css' %}"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


<div class="dashboard">


    <main class="main-content">


        <!-- ==========================
             TOP HEADER
        =========================== -->


        <div class="top-header">


            <div>

                <h1>

                    <i class="fas fa-user-edit"></i>

                    Edit Employee

                </h1>


                <p>

                    Update employee salary profile

                </p>

            </div>



            <a
                href="{% url 'employee_salary_list' %}"
                class="back-btn"
            >

                <i class="fas fa-arrow-left"></i>

                Back

            </a>


        </div>



        <!-- ==========================
             FORM CARD
        =========================== -->


        <div class="form-card">


            <div class="form-title">


                <i class="fas fa-id-card"></i>


                <h2>

                    Employee Information

                </h2>


            </div>



            <form
                method="POST"
                action="{% url 'salary_edit_employee' employee.id %}"
            >


                {% csrf_token %}



                <div class="form-grid">


                    <!-- Employee ID -->

                    <div class="form-group">

                        <label>

                            Employee ID

                        </label>


                        <input
                            type="text"
                            value="{{ employee.employee_id }}"
                            readonly
                        >

                    </div>



                    <!-- Employee Name -->

                    <div class="form-group">

                        <label>

                            Employee Name

                        </label>


                        <input
                            type="text"
                            name="name"
                            value="{{ employee.name }}"
                            required
                        >

                    </div>



                    <!-- Department -->

                    <div class="form-group">

                        <label>

                            Department

                        </label>


                        <input
                            type="text"
                            name="department"
                            value="{{ employee.department|default:'' }}"
                        >

                    </div>



                    <!-- Designation -->

                    <div class="form-group">

                        <label>

                            Designation

                        </label>


                        <input
                            type="text"
                            name="designation"
                            value="{{ employee.designation|default:'' }}"
                        >

                    </div>



                    <!-- Basic Salary -->

                    <div class="form-group">

                        <label>

                            Basic Salary

                        </label>


                        <input
                            type="number"
                            name="basic_salary"
                            value="{{ employee.basic_salary }}"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>



                    <!-- Status -->

                    <div class="form-group">

                        <label>

                            Status

                        </label>


                        <select
                            name="status"
                        >

                            <option
                                value="Active"
                                {% if employee.status == "Active" %}
                                    selected
                                {% endif %}
                            >
                                Active
                            </option>


                            <option
                                value="Inactive"
                                {% if employee.status == "Inactive" %}
                                    selected
                                {% endif %}
                            >
                                Inactive
                            </option>


                            <option
                                value="Resigned"
                                {% if employee.status == "Resigned" %}
                                    selected
                                {% endif %}
                            >
                                Resigned
                            </option>


                            <option
                                value="Terminated"
                                {% if employee.status == "Terminated" %}
                                    selected
                                {% endif %}
                            >
                                Terminated
                            </option>

                        </select>

                    </div>



                    <!-- Joining Date -->

                    <div class="form-group">

                        <label>

                            Joining Date

                        </label>


                        <input
                            type="date"
                            name="joined_date"
                            value="{{ employee.joined_date|date:'Y-m-d' }}"
                            required
                        >

                    </div>


                </div>



                <!-- ==========================
                     BUTTON AREA
                =========================== -->


                <div class="button-area">


                    <button
                        type="submit"
                        class="save-btn"
                    >

                        <i class="fas fa-save"></i>

                        Save Changes

                    </button>



                    <a
                        href="{% url 'salary_dashboard' %}"
                        class="cancel-btn"
                    >

                        <i class="fas fa-times"></i>

                        Cancel

                    </a>


                </div>


            </form>


        </div>


    </main>


</div>


</body>

</html>
