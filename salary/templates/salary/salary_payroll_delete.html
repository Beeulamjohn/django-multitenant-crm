{% load static %}

<!DOCTYPE html>

<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Delete Payroll
    </title>


    <style>

        :root {

            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};

        }

    </style>


    <link
        rel="stylesheet"
        href="{% static 'css/salary_payroll_delete.css' %}"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<div class="delete-container">


    <div class="delete-card">


        <div class="delete-icon">

            <i class="fas fa-trash"></i>

        </div>


        <h1>
            Delete Payroll?
        </h1>


        <p>

            Are you sure you want to delete the payroll
            record of

            <strong>
                {{ payroll.employee.name }}
            </strong>?

        </p>


        <div class="delete-details">


            <div>

                <span>
                    Payroll Month
                </span>

                <strong>
                    {{ payroll.month }} {{ payroll.year }}
                </strong>

            </div>


            <div>

                <span>
                    Net Salary
                </span>

                <strong>
                    ₹ {{ payroll.net_salary|floatformat:2 }}
                </strong>

            </div>


        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="delete-actions">


                <a
                    href="{% url 'salary_payroll_list' %}"
                    class="cancel-btn"
                >

                    <i class="fas fa-times"></i>

                    Cancel

                </a>


                <button
                    type="submit"
                    class="confirm-delete-btn"
                >

                    <i class="fas fa-trash"></i>

                    Delete Payroll

                </button>


            </div>


        </form>


    </div>


</div>


</body>

</html>
