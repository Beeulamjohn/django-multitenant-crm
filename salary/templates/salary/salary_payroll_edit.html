{% load static %}

<!DOCTYPE html>

<html
    lang="{{ appearance.language|default:'en' }}"
    data-theme="{{ appearance.theme|default:'light' }}"
    data-font-size="{{ appearance.font_size|default:'medium' }}"
    data-dashboard-layout="{{ appearance.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ appearance.sidebar_style|default:'expanded' }}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit Payroll
    </title>


    <style>

        :root {

            --accent-color:
                {{ appearance.accent_color|default:"#2563eb" }};

        }

    </style>


    <link
        rel="stylesheet"
        href="{% static 'css/salary_payroll_create.css' %}"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<div class="container">


    <div class="top-header">


        <div class="title-section">


            <div class="icon-box">

                <i class="fas fa-edit"></i>

            </div>


            <div>

                <h1>
                    Edit Payroll
                </h1>

                <p>
                    Update employee salary payment details
                </p>

            </div>


        </div>


        <a
            href="{% url 'salary_payroll_list' %}"
            class="back-btn"
        >

            <i class="fas fa-arrow-left"></i>

            Back

        </a>


    </div>


    <div class="payroll-card">


        <form method="POST">

            {% csrf_token %}


            <h2>

                <i class="fas fa-user-tie"></i>

                Employee Details

            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label for="employee">
                        Employee
                    </label>


                    <select
                        name="employee"
                        id="employee"
                        required
                    >

                        <option
                            value="{{ payroll.employee.id }}"
                            selected
                        >

                            {{ payroll.employee.name }}

                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="month">
                        Payroll Month
                    </label>


                    <select
                        name="month"
                        id="month"
                        required
                    >

                        {% for month in "January,February,March,April,May,June,July,August,September,October,November,December"|make_list %}

                        {% endfor %}

                        <option
                            value="January"
                            {% if payroll.month == "January" %}selected{% endif %}
                        >
                            January
                        </option>

                        <option
                            value="February"
                            {% if payroll.month == "February" %}selected{% endif %}
                        >
                            February
                        </option>

                        <option
                            value="March"
                            {% if payroll.month == "March" %}selected{% endif %}
                        >
                            March
                        </option>

                        <option
                            value="April"
                            {% if payroll.month == "April" %}selected{% endif %}
                        >
                            April
                        </option>

                        <option
                            value="May"
                            {% if payroll.month == "May" %}selected{% endif %}
                        >
                            May
                        </option>

                        <option
                            value="June"
                            {% if payroll.month == "June" %}selected{% endif %}
                        >
                            June
                        </option>

                        <option
                            value="July"
                            {% if payroll.month == "July" %}selected{% endif %}
                        >
                            July
                        </option>

                        <option
                            value="August"
                            {% if payroll.month == "August" %}selected{% endif %}
                        >
                            August
                        </option>

                        <option
                            value="September"
                            {% if payroll.month == "September" %}selected{% endif %}
                        >
                            September
                        </option>

                        <option
                            value="October"
                            {% if payroll.month == "October" %}selected{% endif %}
                        >
                            October
                        </option>

                        <option
                            value="November"
                            {% if payroll.month == "November" %}selected{% endif %}
                        >
                            November
                        </option>

                        <option
                            value="December"
                            {% if payroll.month == "December" %}selected{% endif %}
                        >
                            December
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Payroll Year
                    </label>


                    <input
                        type="number"
                        id="year"
                        name="year"
                        value="{{ payroll.year }}"
                        min="2000"
                        max="2100"
                        required
                    >

                </div>


            </div>


            <h2>

                <i class="fas fa-money-check-dollar"></i>

                Salary Details

            </h2>


            <div class="salary-grid">


                <div class="form-group">

                    <label for="basic_salary">
                        Basic Salary
                    </label>


                    <input
                        type="number"
                        id="basic_salary"
                        name="basic_salary"
                        value="{{ payroll.basic_salary }}"
                        step="0.01"
                        min="0"
                        oninput="calculateSalary()"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="allowance">
                        Allowance
                    </label>


                    <input
                        type="number"
                        id="allowance"
                        name="allowance"
                        value="{{ payroll.allowance }}"
                        step="0.01"
                        min="0"
                        oninput="calculateSalary()"
                    >

                </div>


                <div class="form-group">

                    <label for="deduction">
                        Deduction
                    </label>


                    <input
                        type="number"
                        id="deduction"
                        name="deduction"
                        value="{{ payroll.deduction }}"
                        step="0.01"
                        min="0"
                        oninput="calculateSalary()"
                    >

                </div>


            </div>


            <div class="salary-preview">


                <div>

                    <span>
                        Net Salary
                    </span>


                    <h3>

                        ₹

                        <span id="salary_view">
                            {{ payroll.net_salary|floatformat:2 }}
                        </span>

                    </h3>

                </div>


                <i class="fas fa-wallet"></i>

            </div>


            <div class="form-actions">


                

                <button
                    type="submit"
                    class="save-btn"
                >

                    <i class="fas fa-save"></i>

                    Update Payroll

                </button>


            </div>


        </form>


    </div>


</div>


<script>

    function calculateSalary() {

        const basic =
            parseFloat(
                document.getElementById("basic_salary").value
            ) || 0;


        const allowance =
            parseFloat(
                document.getElementById("allowance").value
            ) || 0;


        const deduction =
            parseFloat(
                document.getElementById("deduction").value
            ) || 0;


        const salary =
            basic + allowance - deduction;


        document.getElementById("salary_view").textContent =
            salary.toFixed(2);

    }


    document.addEventListener(
        "DOMContentLoaded",
        calculateSalary
    );

</script>


</body>

</html>
