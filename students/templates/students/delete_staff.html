{% load static %}
<!DOCTYPE html>
<html
    lang="{{ settings.language|default:'en' }}"
    data-theme="{{ settings.theme|default:'light' }}"
    data-font-size="{{ settings.font_size|default:'medium' }}"
    data-dashboard-layout="{{ settings.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ settings.sidebar_style|default:'expanded' }}"
>
<head>
 <style>
        :root {
            --accent-color: {{ settings.accent_color|default:"#2563eb" }};
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Staff</title>

    <link rel="stylesheet"
          href="{% static 'css/delete_staff.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="delete-card">

        <i class="fas fa-trash-alt delete-icon"></i>

        <h2>
            Delete Staff
        </h2>

        <p>

            Are you sure you want to delete

            <strong>

                {{ staff.first_name }}
                {{ staff.last_name }}

            </strong>

            ?

        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit"
                    class="delete-btn">

                <i class="fas fa-trash"></i>

                Delete

            </button>

            <a href="{% url 'staff_list' %}"
               class="cancel-btn">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
