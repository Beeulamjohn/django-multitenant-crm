{% load static %}
<!DOCTYPE html>
<html
    lang="{{ settings.language|default:'en' }}"
    data-theme="{{ settings.theme|default:'light' }}"
    data-font-size="{{ settings.font_size|default:'medium' }}"
    data-dashboard-layout="{{ settings.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ settings.sidebar_style|default:'expanded' }}"
>
<head>
 <style>
        :root {
            --accent-color: {{ settings.accent_color|default:"#2563eb" }};
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Course</title>

    <link rel="stylesheet"
          href="{% static 'css/add_course.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="card">

        <div class="card-header">

            <h2>

                <i class="fas fa-edit"></i>

                Edit Course

            </h2>

            <a href="{% url 'course_list' %}"
               class="back-btn">

                <i class="fas fa-arrow-left"></i>

                Back

            </a>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label>Course Code</label>

                    <input type="text"
                           name="course_code"
                           value="{{ course.course_code }}"
                           required>

                </div>

                <div class="form-group">

                    <label>Course Name</label>

                    <input type="text"
                           name="course_name"
                           value="{{ course.course_name }}"
                           required>

                </div>

                <div class="form-group">

                    <label>Duration</label>

                    <input type="text"
                           name="duration"
                           value="{{ course.duration }}"
                           required>

                </div>

                <div class="form-group">

                    <label>Fees</label>

                    <input type="number"
                           name="fees"
                           value="{{ course.fees }}"
                           required>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select name="status">

                        <option value="Active"
                        {% if course.status == "Active" %}
                        selected
                        {% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                        {% if course.status == "Inactive" %}
                        selected
                        {% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

            </div>

            <div class="button-box">

                <button type="submit"
                        class="save-btn">

                    <i class="fas fa-save"></i>

                    Update Course

                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
