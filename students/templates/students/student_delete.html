{% load static %}
<!DOCTYPE html>
<html
    lang="{{ settings.language|default:'en' }}"
    data-theme="{{ settings.theme|default:'light' }}"
    data-font-size="{{ settings.font_size|default:'medium' }}"
    data-dashboard-layout="{{ settings.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ settings.sidebar_style|default:'expanded' }}"
>
<head>
 <style>
        :root {
            --accent-color: {{ settings.accent_color|default:"#2563eb" }};
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delete</title>
    <link rel="stylesheet" href="{% static 'css/delete.css' %}">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body text-center">
            <h3>
                Delete Student
            </h3>
            <p>
                Are you sure you want to delete
                <strong>
                    {{ student.first_name }}
                </strong>
                ?
            </p>
            <form method="POST">
                {% csrf_token %}
                <button class="btn btn-danger">
                    Delete
                </button>
                <a href="{% url 'student_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
