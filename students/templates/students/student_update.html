{% load static %}
<!DOCTYPE html>
<html
    lang="{{ settings.language|default:'en' }}"
    data-theme="{{ settings.theme|default:'light' }}"
    data-font-size="{{ settings.font_size|default:'medium' }}"
    data-dashboard-layout="{{ settings.dashboard_layout|default:'grid' }}"
    data-sidebar-style="{{ settings.sidebar_style|default:'expanded' }}"
>
<head>
 <style>
        :root {
            --accent-color: {{ settings.accent_color|default:"#2563eb" }};
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>upload</title>
    <link rel="stylesheet" href="{% static 'css/upload.css' %}">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header">
            <h3>Edit Student</h3>
        </div>
        <div class="card-body">
            <form method="POST"
      enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <div class="button-group">

        <a href="{% url 'company_dashboard' %}" 
           class="back-btn">
           
            Back
        </a>

        <button type="submit" class="btn btn-success">
            <i class="fas fa-save"></i>
            Update Student
        </button>

    </div>

</form>
        </div>
    </div>
</div>
</body>
</html>
